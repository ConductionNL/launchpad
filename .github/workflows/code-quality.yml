name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, beta, development]
  workflow_dispatch:

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: launchpad
      php-version: "8.3"
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      # Hard gates:
      #   - PHPUnit — wired in wave3.10. Was a 4-way matrix (PHP 8.3/8.4
      #     × NC stable31/stable32), all green; stable31 dropped with the
      #     NC floor raise to 32 (see nextcloud-test-refs below).
      #   - Newman — wired alongside the postman collection drift
      #     sweep (PR #123 follow-up): six real backend bugs fixed
      #     (Templates SQL, Feeds 2× constraint, addWidget TypeError,
      #     Lock-on-nonexistent, share TypeError, addRule TypeError),
      #     postman fixture-id wiring repaired and assertion drift
      #     resolved. 196 assertions / 0 failures locally.
      #
      # Playwright remains disabled — the shared workflow's
      # PHP-built-in-server lifetime is the blocker (cross-repo PR
      # `ConductionNL/.github#37`). The `tests/e2e/global-setup.ts`
      # `ensureBundleBuilt()` helper is in place so once the shared
      # workflow lands, flipping the gate Just Works.
      enable-phpunit: true
      # Previously unset, so this inherited the shared workflow's default of
      # '["stable31", "stable32"]'. Pinned explicitly with the NC floor raise to 32.
      # The floor is enforced at INSTALL time, so `occ app:enable` refuses on NC 31 —
      # but the shared workflow runs app-enable as `|| echo "::warning::..."`, so that
      # refusal is only a warning. The job then continues without its data layer and
      # dies ~70s later on missing schemas, which reads like an app/migration fault
      # rather than an unsatisfiable dependency. Order matters too: the newman/
      # playwright/journeydoc jobs check the server out at
      # fromJSON(inputs.nextcloud-test-refs)[0].
      nextcloud-test-refs: '["stable32"]'
      enable-newman: true
      newman-environment-path: "tests/integration/local.env.json"
