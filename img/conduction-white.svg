<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The Conduction mark in white: the hexagon, with the grid glyph cut out so
       the tile's brand colour shows through it. -->
  <defs>
    <mask id="conduction-glyph">
      <rect width="512" height="512" fill="#ffffff"/>
      <g transform="translate(136, 136) scale(7.5)" fill="#000000" stroke="#000000">
        <rect x="4" y="4" width="10" height="10" rx="2" fill="none" stroke-width="1.8"/>
        <rect x="18" y="4" width="10" height="10" rx="2" fill="none" stroke-width="1.8"/>
        <rect x="4" y="18" width="10" height="10" rx="2" fill="none" stroke-width="1.8"/>
        <rect x="18" y="18" width="10" height="10" rx="2" fill="#000000" opacity="0.3"/>
        <rect x="18" y="18" width="10" height="10" rx="2" fill="none" stroke-width="1.8"/>
        <line x1="7" y1="7" x2="11" y2="11" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="23" cy="9" r="2.5"/>
        <line x1="7" y1="21" x2="11" y2="25" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="11" y1="21" x2="7" y2="25" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </mask>
  </defs>
  <polygon points="256,26 455.19,141 455.19,371 256,486 56.81,371 56.81,141" fill="#ffffff" mask="url(#conduction-glyph)"/>
</svg>
