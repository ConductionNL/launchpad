name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package release ZIP
        run: |
          mkdir -p /tmp/sendentworkspace
          cp -r appinfo lib css img js l10n templates /tmp/sendentworkspace/
          # Remove source maps from release
          find /tmp/sendentworkspace/js -name '*.map' -delete
          cd /tmp
          zip -r sendentworkspace.zip sendentworkspace/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/sendentworkspace.zip
          generate_release_notes: true
