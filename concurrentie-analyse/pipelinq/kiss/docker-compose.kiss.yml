version: '3.4'

# KISS (Klantinteractie-Servicesysteem) for local development
# Connects to existing openregister-network infrastructure
#
# Prerequisites:
#   - openregister-postgres running on openregister-network
#   - openregister-keycloak running (from docker-compose.sso.yml)
#   - openregister-openzaak running (--profile openzaak)
#   - openregister-openklant running (--profile openklant)
#
# Start:
#   docker compose -f docker-compose.kiss.yml up -d
#
# Access KISS at: http://localhost:9030

services:
  # KISS BFF (.NET 8 + Vue 3 frontend)
  kiss-bff:
    image: kiss-bff-local:latest
    container_name: kiss-bff
    restart: unless-stopped
    ports:
      - "9030:8080"
    environment:
      # ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true

      # OIDC Authentication (Keycloak)
      # Note: OIDC_AUTHORITY must be accessible from BOTH the browser AND the container.
      # Browser uses localhost:8081, container uses openregister-keycloak:8080.
      # We use localhost:8081 so the browser can reach it for login redirects.
      - OIDC_AUTHORITY=http://localhost:8081/realms/commonground
      - OIDC_METADATA_URL=http://openregister-keycloak:8080/realms/commonground/.well-known/openid-configuration
      - OIDC_CLIENT_ID=kiss
      - OIDC_CLIENT_SECRET=kiss-secret-change-me
      - OIDC_KLANTCONTACTMEDEWERKER_ROLE=user
      - OIDC_REDACTEUR_ROLE=admin
      - OIDC_BEHEERDER_ROLE=admin
      - OIDC_KENNISBANK_ROLE=admin
      - OIDC_MEDEWERKER_IDENTIFICATIE_CLAIM=preferred_username
      - OIDC_MEDEWERKER_IDENTIFICATIE_TRUNCATE=8

      # PostgreSQL (KISS's own database on dedicated postgres)
      - POSTGRES_USER=kiss
      - POSTGRES_PASSWORD=kiss-secret
      - POSTGRES_HOST=kiss-postgres
      - POSTGRES_DB=kiss
      - POSTGRES_PORT=5432

      # Elasticsearch (direct, no Enterprise Search)
      - ELASTIC_BASE_URL=http://kiss-elasticsearch:9200
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=kiss-elastic-secret
      - ENTERPRISE_SEARCH_ENGINE=kiss-engine
      - ENTERPRISE_SEARCH_BASE_URL=http://kiss-elasticsearch:9200
      - ENTERPRISE_SEARCH_PRIVATE_API_KEY=not-used-with-basic-elastic
      - ENTERPRISE_SEARCH_PUBLIC_API_KEY=not-used-with-basic-elastic

      # OpenKlant 2 (primary register)
      - REGISTERS__0__IS_DEFAULT=true
      - REGISTERS__0__REGISTRY_VERSION=OpenKlant2
      - REGISTERS__0__KLANTINTERACTIE_BASE_URL=http://openregister-openklant:8000/klantinteracties/api/v1
      - REGISTERS__0__KLANTINTERACTIE_TOKEN=openklant-token
      - REGISTERS__0__ZAAKSYSTEEM_BASE_URL=http://openregister-openzaak:8000/zaken/api/v1
      - REGISTERS__0__ZAAKSYSTEEM_API_KEY=openzaak-secret-change-me
      - REGISTERS__0__ZAAKSYSTEEM_API_CLIENT_ID=kiss
      - REGISTERS__0__ZAAKSYSTEEM_DEEPLINK_URL=http://localhost:8089/zaken/api/v1
      - REGISTERS__0__ZAAKSYSTEEM_DEEPLINK_PROPERTY=identificatie

      # Contactmomenten / klanten API (legacy OpenKlant 1 - optional)
      - CONTACTMOMENTEN_BASE_URL=http://openregister-openklant:8000/contactmomenten/api/v1
      - CONTACTMOMENTEN_API_KEY=openklant-secret-change-me
      - CONTACTMOMENTEN_API_CLIENT_ID=kiss
      - KLANTEN_BASE_URL=http://openregister-openklant:8000/klanten/api/v1
      - KLANTEN_CLIENT_ID=kiss
      - KLANTEN_CLIENT_SECRET=openklant-secret-change-me
      - KLANTINTERACTIES_BASE_URL=http://openregister-openklant:8000/klantinteracties/api/v1
      - KLANTINTERACTIES_TOKEN=openklant-token

      # ZGW APIs via OpenZaak
      - ZAKEN_API_KEY=openzaak-secret-change-me
      - ZAKEN_API_CLIENT_ID=kiss

      # Objects API endpoints (afdelingen, groepen, VACs - skip for now)
      - AFDELINGEN_BASE_URL=
      - AFDELINGEN_TOKEN=
      - AFDELINGEN_OBJECT_TYPE_URL=
      - GROEPEN_BASE_URL=
      - GROEPEN_TOKEN=
      - GROEPEN_OBJECT_TYPE_URL=
      - VAC_OBJECTEN_BASE_URL=
      - VAC_OBJECTEN_TOKEN=
      - VAC_OBJECT_TYPE_URL=
      - VAC_OBJECT_TYPE_VERSION=
      - LOGBOEK_BASE_URL=
      - LOGBOEK_TOKEN=
      - LOGBOEK_OBJECT_TYPE_URL=
      - LOGBOEK_OBJECT_TYPE_VERSION=
      - INTERNE_TAAK_BASE_URL=
      - INTERNE_TAAK_TOKEN=
      - INTERNE_TAAK_OBJECT_TYPE_URL=

      # BRP (Haal Centraal BRP Personen Bevragen mock)
      # Uses official RVIG personen-mock container on openregister-network
      - HAAL_CENTRAAL_BASE_URL=http://brp-personen-mock:8080/haalcentraal/api
      - HAAL_CENTRAAL_API_KEY=not-needed-for-mock

      # KVK (official test API - public key, no registration needed)
      - KVK_BASE_URL=https://api.kvk.nl/test/api
      - KVK_API_KEY=l7xx1f2691f2520d487b902f4e0b57a0b197

      # SDG (not available)
      - SDG_BASE_URL=
      - SDG_API_KEY=

      # Email (disabled)
      - EMAIL_HOST=
      - EMAIL_PORT=
      - EMAIL_USERNAME=
      - EMAIL_PASSWORD=
      - EMAIL_ENABLE_SSL=false
      - FEEDBACK_EMAIL_FROM=
      - FEEDBACK_EMAIL_TO=

      # Organisation
      - ORGANISATIE_IDS=999990639
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kiss-postgres:
        condition: service_healthy
      kiss-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # KISS PostgreSQL (separate from openregister-postgres)
  kiss-postgres:
    image: postgres:16-alpine
    container_name: kiss-postgres
    restart: unless-stopped
    volumes:
      - kiss-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=kiss
      - POSTGRES_PASSWORD=kiss-secret
      - POSTGRES_DB=kiss
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiss -d kiss"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Elasticsearch 8 (single node, minimal config)
  kiss-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: kiss-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=kiss-elastic-secret
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=kiss-cluster
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - kiss-es-data:/usr/share/elasticsearch/data
    ports:
      - "9230:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:kiss-elastic-secret http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  kiss-db:
  kiss-es-data:

networks:
  default:
    name: openregister-network
    external: true
