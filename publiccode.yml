description:
  en:
    shortDescription: >
      Drag-and-drop dashboards with templates, tiles and smart visibility for Nextcloud.
    longDescription: >
      LaunchPad extends the Nextcloud dashboard. Users create personal workspaces
      with drag-and-drop widgets, custom shortcut tiles and smart visibility rules,
      and admins roll out dashboard templates to entire teams. LaunchPad works with
      every existing Nextcloud dashboard widget, supporting both the v1 and v2
      Dashboard APIs. It suits organisations that want consistent, curated
      dashboards for their teams while still giving users the freedom to
      personalise them. Conduction maintains this component within the Nextcloud
      ISV programme. LaunchPad is available in the Nextcloud App Store at
      https://apps.nextcloud.com/apps/launchpad.
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-widgets.png
      - img/screenshot-admin.png
    features:
      - Drag-and-drop grid layout to position and resize widgets
      - Multiple dashboards per user
      - Custom shortcut tiles with icons, colours and links
      - Admin templates distributed to user groups
      - View-only, add-only or full customisation per template
      - Conditional widget visibility by group, time of day or date
      - Per-widget styling of colours, borders and titles
      - Compulsory widgets that users cannot remove
      - Dashboard sharing with users, groups or a read-only public link
      - Group dashboards next to personal dashboards

  nl:
    shortDescription: >
      Drag-and-drop dashboards met templates, tegels en slimme zichtbaarheid voor Nextcloud.
    longDescription: >
      LaunchPad breidt het Nextcloud-dashboard uit. Gebruikers maken persoonlijke
      werkruimtes met drag-and-drop widgets, eigen snelkoppelingstegels en slimme
      zichtbaarheidsregels, en beheerders rollen dashboardtemplates uit naar hele
      teams. LaunchPad werkt met elke bestaande Nextcloud-dashboardwidget en
      ondersteunt zowel de v1- als de v2-Dashboard-API. Het is bedoeld voor
      organisaties die consistente, samengestelde dashboards voor hun teams willen,
      terwijl gebruikers de vrijheid houden om ze te personaliseren. Conduction
      onderhoudt dit component binnen het Nextcloud ISV-programma. LaunchPad is
      beschikbaar in de Nextcloud App Store via
      https://apps.nextcloud.com/apps/launchpad.
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-widgets.png
      - img/screenshot-admin.png
    features:
      - Drag-and-drop rasterindeling om widgets te plaatsen en te schalen
      - Meerdere dashboards per gebruiker
      - Eigen snelkoppelingstegels met iconen, kleuren en links
      - Beheerdertemplates die naar gebruikersgroepen worden uitgerold
      - Alleen bekijken, toevoegen of volledige aanpassing per template
      - Conditionele zichtbaarheid van widgets op groep, tijdstip of datum
      - Styling per widget voor kleuren, randen en titels
      - Verplichte widgets die gebruikers niet kunnen verwijderen
      - Dashboards delen met gebruikers, groepen of via een alleen-lezen publieke link
      - Groepsdashboards naast persoonlijke dashboards

